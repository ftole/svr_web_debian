name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint, Sintaxis y Pruebas Unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar sintaxis de scripts (bash -n)
        run: |
          find . -type f \( -name "*.sh" -o -path "./bin/*" \) -print0 | while IFS= read -r -d '' f; do
            echo "::group::bash -n $f"
            bash -n "$f"
            echo "::endgroup::"
          done

      - name: ShellCheck (Advertencias y Errores)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          find . -type f \( -name "*.sh" -o -path "./bin/*" \) -print0 | xargs -0 shellcheck -S warning

      - name: Ejecutar Suite de Pruebas de Validacion (Chaos Testing)
        run: |
          bash tests/test_validator.sh

      - name: Lint del workflow (actionlint)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color -oneline -shellcheck=
