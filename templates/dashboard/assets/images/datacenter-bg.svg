<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" style="background-color: #F4F7F6;">
  <defs>
    <!-- Patrón del piso técnico (Perspectiva simulada) -->
    <pattern id="floor-grid" width="100" height="40" patternUnits="userSpaceOnUse">
      <path d="M0,0 L100,0 M0,20 L100,20 M0,40 L100,40" stroke="#E1EBE7" stroke-width="1" fill="none"/>
      <path d="M20,0 L0,40 M40,0 L20,40 M60,0 L40,40 M80,0 L60,40 M100,0 L80,40 M120,0 L100,40" stroke="#E1EBE7" stroke-width="0.5" fill="none"/>
    </pattern>

    <!-- Patrón de bahías de servidor (Rack Unit) -->
    <pattern id="server-u" width="80" height="15" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="80" height="15" fill="none" stroke="#B4C9C1" stroke-width="0.5"/>
      <line x1="5" y1="7.5" x2="60" y2="7.5" stroke="#B4C9C1" stroke-width="0.5"/>
      <!-- LEDs de estado -->
      <circle cx="70" cy="7.5" r="1.5" fill="#5C8D7B" opacity="0.6"/>
      <circle cx="75" cy="7.5" r="1.5" fill="#B4C9C1" opacity="0.4"/>
    </pattern>

    <g id="rack">
      <!-- Estructura principal del Rack -->
      <rect x="0" y="0" width="90" height="400" fill="#FFFFFF" stroke="#5C8D7B" stroke-width="1" rx="2"/>
      <!-- Ranuras laterales -->
      <rect x="5" y="5" width="80" height="390" fill="url(#server-u)"/>
      <!-- Marcos exteriores -->
      <line x1="0" y1="395" x2="90" y2="395" stroke="#5C8D7B" stroke-width="1"/>
      <line x1="0" y1="5" x2="90" y2="5" stroke="#5C8D7B" stroke-width="1"/>
    </g>
  </defs>

  <!-- Bandejas de cables superiores -->
  <g stroke="#B4C9C1" stroke-width="1" fill="none" opacity="0.6">
    <path d="M0,100 L1440,100 M0,120 L1440,120"/>
    <path d="M0,110 L1440,110" stroke-dasharray="4,4"/>
    <path d="M200,120 L200,200 M210,120 L210,200 M400,120 L400,200 M410,120 L410,200 M600,120 L600,200 M610,120 L610,200 M800,120 L800,200 M810,120 L810,200 M1000,120 L1000,200 M1010,120 L1010,200 M1200,120 L1200,200 M1210,120 L1210,200" stroke-width="0.5"/>
  </g>

  <!-- Piso Técnico -->
  <rect x="0" y="600" width="1440" height="300" fill="url(#floor-grid)"/>
  <path d="M0,600 L1440,600" stroke="#5C8D7B" stroke-width="2" opacity="0.3"/>

  <!-- Fila de Racks -->
  <g transform="translate(0, 200)" opacity="0.8">
    <use href="#rack" x="150"/>
    <use href="#rack" x="250"/>
    <use href="#rack" x="350"/>
    
    <use href="#rack" x="550"/>
    <use href="#rack" x="650"/>
    <use href="#rack" x="750"/>
    
    <use href="#rack" x="950"/>
    <use href="#rack" x="1050"/>
    <use href="#rack" x="1150"/>
  </g>

  <!-- Gradiente para dar efecto de "fade" y legibilidad al centro -->
  <radialGradient id="center-fade" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#F4F7F6" stop-opacity="0.9"/>
    <stop offset="60%" stop-color="#F4F7F6" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#F4F7F6" stop-opacity="0.1"/>
  </radialGradient>
  <rect x="0" y="0" width="1440" height="900" fill="url(#center-fade)"/>
</svg>
